# nginx in front of common-service (docker compose publishes it on 127.0.0.1:8080).
# Install as /etc/nginx/sites-available/api.jsonreader.com, then:
#   sudo certbot --nginx -d api.jsonreader.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream common_service {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.jsonreader.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.jsonreader.com;

    ssl_certificate     /etc/letsencrypt/live/api.jsonreader.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.jsonreader.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Largest request: a 2 MB Markdown document (+ options) or a 1 MB room.
    client_max_body_size 4m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location / {
        proxy_pass http://common_service;
        proxy_read_timeout 60s;
    }

    # Server-sent events: compiler output must not be buffered.
    location ~ ^/v1/(run(/|$)|[a-z+]+/stream$) {
        proxy_pass http://common_service;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # WebSocket rooms.
    location ~ ^/v1/rooms/[A-Za-z0-9]+/ws$ {
        proxy_pass http://common_service;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
